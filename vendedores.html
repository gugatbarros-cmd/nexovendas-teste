<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendedores | NexoVendas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="vendedores">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html">NexoVendas</a>
        <nav class="sidebar-nav">
          <a href="dashboard.html">Painel</a>
          <a href="clientes.html" data-module="clientes">Clientes</a>
          <a href="pedidos.html" data-module="pedidos">Pedidos</a>
          <a href="estoque.html" data-module="estoque">Estoque</a>
          <a class="active" href="vendedores.html" data-module="vendedores">Vendedores</a>
        </nav>
        <button id="logout-btn" class="btn btn-secondary" type="button">Sair</button>
      </aside>

      <main class="app-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Administração</p>
            <h1>Gestão de vendedores</h1>
          </div>
        </header>

        <section class="panel form-panel">
          <form id="seller-form" class="app-form">
            <input type="text" name="name" placeholder="Nome do vendedor" required />
            <input type="email" name="email" placeholder="E-mail" required />
            <input type="password" name="password" placeholder="Senha" required />
            <button class="btn btn-primary" type="submit">Salvar vendedor</button>
          </form>
          <p id="seller-status" class="form-status"></p>
        </section>

        <section class="panel form-panel">
          <h2>Importar base de vendedores</h2>
          <form id="seller-import-form" class="app-form import-form">
            <input id="seller-import-file" type="file" accept=".csv,.json" required />
            <button class="btn btn-secondary" type="submit">Importar CSV/JSON</button>
          </form>
          <div class="import-actions">
            <label><input id="seller-replace-data" type="checkbox" /> Substituir dados existentes</label>
            <button id="seller-download-template" class="btn btn-secondary small" type="button">Baixar modelo</button>
          </div>
          <p id="seller-import-status" class="form-status"></p>
          <p class="muted-text">Use um arquivo com nome, e-mail e senha para facilitar a carga inicial.</p>
        </section>

        <section class="panel">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Perfil</th>
              </tr>
            </thead>
            <tbody id="seller-table-body"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
